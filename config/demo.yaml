project:
  name: "QRUM synthetic demonstration"
  output_stem: "demo_qrum"
data:
  strain_file: "data/demo_strain.npy"
  dataset_path: null
  sample_rate: 4096.0
  start_time: 0.0
  duration: 32.0
  template_file: "data/demo_template.npy"
preprocessing:
  detrend: "linear"
  highpass_hz: 20.0
  lowpass_hz: 500.0
  filter_order: 4
  taper_fraction: 0.02
psd:
  nperseg_seconds: 2.0
  overlap_fraction: 0.5
  window: "hann"
fit:
  fmin_hz: 80.0
  fmax_hz: 250.0
  f0_bounds_hz: [120.0, 180.0]
  q_bounds: [2.0, 100.0]
  amplitude_bounds: [0.0, 1000000.0]
  baseline: "linear"
  use_log_power: false
line_exclusion:
  enabled: true
  half_width_hz: 0.8
  frequencies_hz: [60.0, 120.0, 180.0, 240.0]
bootstrap:
  enabled: true
  iterations: 100
  seed: 20260727
plots:
  dpi: 180
  log_x: false
  log_y: true
